- name: install apt packages
  become: true
  apt:
    name:
      - build-essential
      - htop
      - curl
      - wget
      - unzip
      - xclip
      - feh
      - pavucontrol
      - moreutils
      - ripgrep
      - python3-pip
      - screenkey
      - compton
      - lsof
      - ccache
      - nvidia-settings
      - bat
      - ufw
      - nmap
      - openssh-server
      - zsh
      - neofetch
  tags:
    - install
    - core


- name: install c packages
  become: true
  apt:
    name:
      - cmake
      - clang
      - clangd
  tags:
    - install
    - core
    - neovim

- name: install snap packages
  become: true
  snap:
    name: 
      - gh # github cli
    classic: true
